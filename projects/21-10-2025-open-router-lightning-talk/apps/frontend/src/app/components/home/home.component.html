<div class="min-h-full flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-2xl bg-gray-800 rounded-lg shadow-2xl overflow-hidden p-6 sm:p-8 border border-gray-700">
    <div class="text-center">
      <div class="mb-4 sm:mb-6">
        <h1 class="text-3xl sm:text-4xl font-semibold text-white mb-2">Live Chat</h1>
        <p class="text-gray-400 text-sm sm:text-base">Real-time messaging via Server-Sent Events</p>
      </div>
      
      <div class="mb-6 sm:mb-8">
        <svg class="mx-auto h-16 w-16 sm:h-24 sm:w-24 text-gray-400 mb-3 sm:mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
        <p class="text-gray-500 text-base sm:text-lg px-4">Experience real-time communication powered by OpenRouter API</p>
      </div>

      <div class="space-y-4">
        <button 
          (click)="navigateToChat()"
          class="w-full px-6 sm:px-8 py-3 sm:py-4 bg-gray-700 text-white font-medium rounded-lg hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:ring-offset-gray-800 transition-all duration-200 flex items-center justify-center gap-2 border border-gray-600 text-sm sm:text-base">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          Start Chatting
        </button>
        
        <div class="text-xs sm:text-sm text-gray-500">
          <p>Powered by Angular 20 & Server-Sent Events</p>
        </div>
      </div>
    </div>
  </div>
</div>
